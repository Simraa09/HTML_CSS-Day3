<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 5</title>
    <style>
        p{
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 0px;
            margin-top: 0px;
        }

        .price{
            font-size: 35px;
        }

        .usd{
            color:gray;
            font-size: 18px;
        }

        .rate{
            color: green;
            margin-top: 10px;
        }

</html>
