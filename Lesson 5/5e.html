<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 5</title>
    <style>
        p{
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 0px;
            margin-bottom: 0px;
            text-align: center;
            color: rgb(53, 53, 53);
        }

        .new{
            color: red;
            font-size: 14px;
        }

        .title{
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        .subtitle{
            font-size: 40px;
            margin-top: 1px;
            font-weight: bolder;
        }

        .price{
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .buy{
            background-color: rgb(31, 146, 240);
            color: white;
            font-weight: bold;
            font-size: 12px;
            padding-bottom: 7px;
            padding-top: 7px;
            padding-left: 12px;
            padding-right: 12px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            
        }

    </style>
</head>
<body>
    <p class="new"> New </p>
    <p class="title"> MacBook Pro</p>
    <p class="subtitle"> Supercharged for pros. </p>
    <p class="price"> From $1999 </p>
    <p> <span class="buy"> Buy </span> </p>
</body>
</html>
