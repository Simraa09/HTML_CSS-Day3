<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 8</title>
    <style>
        .name{
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 10px;
            width: 120px;
            margin-bottom: 8px;
            border-radius:6px;
            border: solid;
            border-color: rgb(199, 197, 197);
            border-width: 1px;
        }

        .email{
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 10px;
            width: 260px;
            margin-bottom: 8px;
            border-radius:6px;
            border: solid;
            border-color: rgb(199, 197, 197);
            border-width: 1px;
            display: block;
        }

        .sign-up{
            background-color: rgb(50, 172, 243);
            color: white;
            font-weight: bolder;
            font-size: 18px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 8px;
            width: 274px;
            margin-bottom: 8px;
            border-radius:6px;
            border: none;
            border-width: 2px;
        }
    </style>
</head>
<body>
    <input type="text" class="name" placeholder="First Name">
    <input type="text" class="name" placeholder="Last Name">
    <input type="text" class="email" placeholder="Email">
    <button class="sign-up">Sign Up</button>
</body>
</html>
