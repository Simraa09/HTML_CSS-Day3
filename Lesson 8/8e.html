<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 8</title>
    <style>
        .text{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 35px;
            margin-top: 0px;
            margin-bottom: 20px;
        }

        .input{
            background-color: rgb(238, 236, 236);
            color: rgb(105, 105, 105);
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            width: 350px;
            margin-bottom: 8px;
            border: none;
            display: block;
        }
        .request{
            background-color: black;
            color: white;
            border:none;
            height:40px;
            width:110px;
            border-radius:1px;
            cursor:pointer;
            margin-top: 20px;
        }
        .schedule{
            background-color: rgb(238, 236, 236);
            border:none;
            height:40px;
            width:150px;
            border-radius:1px;
            cursor:pointer;
            margin-left: 18px;
        }
    </style>
</head>
<body>
    <p class="text"> Request a ride now </p>
    <input type="text" class="input" placeholder="Enter pickup location">
    <input type="text" class="input" placeholder="Enter destination">
    <button class="request"> Request now </button>
    <button class="schedule"> Schedule for later </button>
</body>
</html>
