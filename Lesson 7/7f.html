<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 7</title>
    <style>
        p{
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 0px;
        }
        .email{
            color:gray;
            margin-bottom: 8px;
        }
        .input{
            height: 30px;
            width: 390px;
            color:rgb(44, 44, 44);
            border-radius: 4px;
            border: solid;
            border-color: rgb(170, 169, 169);
            border-width: 2px;
        }

        .text{
            color:gray;
            margin-bottom: 15px;
        }

        .agree{
            font-size: 20px;
            color: white;
            background-color: blue;
            border: none;
            border-radius: 35px;
            padding-top: 16px;
            padding-bottom: 16px;
            width: 400px;
            text-align: center;
            opacity: 0.7
        }
    </style>
</head>
<body>
    <p class="email"> Email </p>
    <input type="text" class="input">
    <p class="text"> By clicking Agree & Join, you agree to the Privacy Policy. </p>
    <button class="agree"> Agree & Join </button>
</body>
</html>
